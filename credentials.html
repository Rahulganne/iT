<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Admin Credentials</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="settings-page">
      <header class="sales-header">
        <div>
          <p class="admin-eyebrow">Verified admin</p>
          <h1>New credentials</h1>
          <p>Choose the new login details and booking prices.</p>
        </div>
        <a href="admin.html" class="back-button">← Dashboard</a>
      </header>
      <form id="credentials-form" class="settings-card" hidden>
        <section class="settings-section">
          <p class="admin-eyebrow">Access control</p>
          <label>New secret code<input name="code" type="password" required /></label>
          <label>New username<input name="username" type="text" required /></label>
          <label>New password<input name="password" type="password" required /></label>
        </section>
        <section class="settings-section">
          <p class="admin-eyebrow">Booking rates</p>
          <label>Big Turf · morning<input name="bigMorning" type="number" min="0" step="1" required /></label>
          <label>Big Turf · afternoon / evening<input name="bigLater" type="number" min="0" step="1" required /></label>
          <label>Small Turf · all day<input name="smallAllDay" type="number" min="0" step="1" required /></label>
        </section>
        <button class="admin-refresh-btn" type="submit">Save encrypted credentials</button>
        <p id="credentials-message" class="pricing-message" aria-live="polite"></p>
      </form>
      <section id="credentials-locked" class="settings-card">
        <h2>Verification required</h2>
        <p>Verify your current credentials from Settings first.</p>
        <a href="settings.html" class="back-button">← Settings</a>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
